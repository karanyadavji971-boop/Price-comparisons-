<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Repair Register (View Only)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f1f5f4; color: #222; padding: 14px; }
        .container { max-width: 650px; margin: auto; }

        /* Header */
        header { background: #087f5b; color: white; padding: 20px; border-radius: 14px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(8, 127, 91, 0.3); text-align: center; }
        header h2 { margin: 0; font-size: 20px; }
        header p { font-size: 12px; color: #d1fae5; margin-top: 4px; }

        /* Cards */
        .card { background: white; padding: 16px; border-radius: 13px; margin-bottom: 14px; box-shadow: 0 2px 9px rgba(0,0,0,0.05); }
        h3 { margin-top: 0; color: #087f5b; font-size: 16px; margin-bottom: 15px; }

        /* Search & Filter */
        .filter-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .filter-row input { flex: 1; }
        .search-input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; margin-bottom: 10px; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; background: #f8fafc; outline: none; }
        button { border: 0; padding: 12px; border-radius: 8px; background: #087f5b; color: white; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: 0.2s; width: 100%; }
        button.secondary { background: #455a64; }
        button.small { padding: 7px 10px; font-size: 12px; margin: 3px; width: auto; }
        button.toggle-btn { background: #fbbf24; color: #000; font-weight: 800; font-size: 14px; margin-bottom: 10px; }

        /* Totals & Entries */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .total { background: #e0f2eb; padding: 16px; border-radius: 10px; text-align: center; }
        .total strong { font-size: 25px; color: #087f5b; display: block; margin-top: 5px; }
        
        /* History Container (Initially Hidden) */
        #historyContainer { display: none; margin-top: 10px; border-top: 1px dashed #cbd5e1; padding-top: 10px; }

        .entry { border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-top: 10px; background: #fff; }
        .entry p { margin: 6px 0; font-size: 14px; color: #334155; }
        .muted { color: #64748b; font-size: 13px; }
        .status-paid { color: #22c55e; font-weight: 700; }
        .status-pending { color: #ef4444; font-weight: 700; }
        #loader { display: none; text-align: center; padding: 15px; font-weight: 600; color: #087f5b; }

        /* Search Status Bar */
        .search-status { background: #fef3c7; color: #92400e; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-bottom: 15px; display: none; text-align: center; border: 1px solid #fcd34d; }
        
        /* Top Badge */
        .view-badge { background: #e0f2eb; color: #087f5b; text-align: center; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 700; margin-bottom: 15px; border: 1px solid #a7f3d0; }
    </style>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 🔴 आपकी Firebase Configuration 🔴
        const firebaseConfig = {
            apiKey: "AIzaSyDS--FcIklOPuekaVU6GoI_oYAwBBHYhqk",
            authDomain: "mobile-repairing-details-971.firebaseapp.com",
            projectId: "mobile-repairing-details-971",
            storageBucket: "mobile-repairing-details-971.firebasestorage.app",
            messagingSenderId: "757152848434",
            appId: "1:757152848434:web:6dcec6f801cc4a10033a2b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const repairsCollection = collection(db, "repairs");

        let allEntries = [];
        let currentDateStr = "";

        // ================= DATE LOGIC =================
        function checkAndUpdateDate() {
            const now = new Date();
            currentDateStr = now.getFullYear() + "-" + 
                             String(now.getMonth() + 1).padStart(2, '0') + "-" + 
                             String(now.getDate()).padStart(2, '0');
            
            // डिफ़ॉल्ट रूप से आज की तारीख फिल्टर में डालें
            document.getElementById("filterDate").value = currentDateStr;
        }

        // ================= LOAD DATA =================
        async function loadData() {
            document.getElementById("records").innerHTML = "<p class='muted'>Loading data...</p>";
            try {
                const q = query(repairsCollection, orderBy("createdAt", "desc"));
                const snapshot = await getDocs(q);
                allEntries = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                // लोड होते ही आज का डेटा फिल्टर करें
                filterTodayData();
            } catch (e) {
                console.error(e);
                document.getElementById("records").innerHTML = "<p class='muted'>Data load error: " + e.message + "</p>";
            }
        }

        // ================= SHOW/HIDE HISTORY =================
        window.toggleHistory = function() {
            const container = document.getElementById("historyContainer");
            const btn = document.getElementById("toggleHistoryBtn");
            if (container.style.display === "none" || container.style.display === "") {
                container.style.display = "block";
                btn.textContent = "🔼 Hide Repair History";
            } else {
                container.style.display = "none";
                btn.textContent = "🔽 Show Repair History";
            }
        };

        // ================= RENDER (READ-ONLY) =================
        window.renderEntries = function(dataArray) {
            const box = document.getElementById("records");
            
            if (!dataArray.length) { 
                box.innerHTML = "<p class='muted'>Is date ka koi record nahi mila.</p>"; 
                document.getElementById("count").textContent = "0";
                document.getElementById("total").textContent = "₹0";
                return; 
            }
            
            box.innerHTML = dataArray.map(x => `
                <div class="entry">
                    <p><b>${escapeHTML(x.date)}</b></p>
                    <p>👤 ${escapeHTML(x.customer)}</p>
                    <p>📞 ${escapeHTML(x.phone || "-")}</p>
                    <p>📱 ${escapeHTML(x.model)}</p>
                    <p>🔧 ${escapeHTML(x.problem || "-")}</p>
                    <p>💰 <b>₹${Number(x.amount).toLocaleString("en-IN")}</b></p>
                    <p>💳 <span class="${x.payment === 'Paid' ? 'status-paid' : 'status-pending'}">${escapeHTML(x.payment)}</span></p>
                </div>
            `).join("");
            
            const sum = dataArray.reduce((s, x) => s + Number(x.amount || 0), 0);
            document.getElementById("count").textContent = dataArray.length;
            document.getElementById("total").textContent = "₹" + sum.toLocaleString("en-IN");
        };

        // ================= FILTER LOGIC =================
        window.filterTodayData = function() {
            document.getElementById("searchInput").value = "";
            document.getElementById("filterDate").value = currentDateStr;
            document.getElementById("searchStatus").style.display = "none";
            
            const filtered = allEntries.filter(x => x.date === currentDateStr);
            renderEntries(filtered);
            
            // Hide history by default
            document.getElementById("historyContainer").style.display = "none";
            document.getElementById("toggleHistoryBtn").textContent = "🔽 Show Repair History";
        }

        window.applyFilters = function() {
            const searchTerm = document.getElementById("searchInput").value.trim().toLowerCase();
            const filterDate = document.getElementById("filterDate").value;
            const statusDiv = document.getElementById("searchStatus");

            let filtered = allEntries.filter(x => {
                let dateMatch = true;
                if (filterDate) {
                    dateMatch = (x.date === filterDate);
                }
                let searchMatch = true;
                if (searchTerm) {
                    searchMatch = [x.customer, x.phone, x.model, x.problem].join(" ").toLowerCase().includes(searchTerm);
                }
                return dateMatch && searchMatch;
            });

            renderEntries(filtered);

            if(searchTerm || filterDate) {
                statusDiv.style.display = "block";
                statusDiv.innerText = `Showing results for "${searchTerm || ''}" ${filterDate ? 'on '+filterDate : ''}`;
            } else {
                statusDiv.style.display = "none";
            }

            // खोजने पर हिस्ट्री खोल दें
            document.getElementById("historyContainer").style.display = "block";
            document.getElementById("toggleHistoryBtn").textContent = "🔼 Hide Repair History";
        };

        window.clearFilters = function() {
            document.getElementById("searchInput").value = "";
            filterTodayData(); // वापस आज के डेटा पर
        };

        window.escapeHTML = function(s) {
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        };

        // Init
        window.onload = function() {
            checkAndUpdateDate();
            loadData();
        };
    </script>
</head>
<body>

<div class="container">
    <header>
        <h2>📱 Repair Register</h2>
        <p>View Only Mode (No Edit Access)</p>
    </header>

    <div class="view-badge">
        👁️ आप सिर्फ डेटा देख सकते हैं, इसमें कुछ बदल नहीं सकते।
    </div>

    <!-- Search & Filter -->
    <div class="card">
        <h3>🔍 Search / Filter</h3>
        <input type="text" id="searchInput" class="search-input" placeholder="Search by Model, Problem, or Customer...">
        <label>Filter by Date</label>
        <div class="filter-row">
            <input type="date" id="filterDate">
            <button class="small" onclick="applyFilters()" style="min-width: 80px;">Filter</button>
            <button class="small secondary" onclick="clearFilters()">Clear</button>
        </div>
        <div id="searchStatus" class="search-status"></div>
    </div>

    <!-- Records Summary (Read-Only) -->
    <div class="card">
        <h3>📊 Total Income</h3>
        <div class="grid">
            <div class="total"><div>Total Records</div><strong id="count">0</strong></div>
            <div class="total"><div>Total Amount</div><strong id="total">₹0</strong></div>
        </div>
    </div>

    <!-- Repair History (Hidden by Default) -->
    <div class="card">
        <button class="toggle-btn" id="toggleHistoryBtn" onclick="toggleHistory()">🔽 Show Repair History</button>
        
        <div id="historyContainer">
            <div id="records"><p class="muted">Loading from cloud...</p></div>
            <div id="loader">⏳ Loading...</div>
        </div>
    </div>

    <p class="muted" style="text-align:center; margin-bottom: 20px;">Powered by Firebase Cloud</p>
</div>

</body>
</html>
